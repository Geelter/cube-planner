name: Deploy
on:
  workflow_run:
    workflows: ["CI"]
    types: [completed]
    branches: [main, master]
  workflow_dispatch:

permissions:
  contents: read
  packages: write
  # Needed by the gate job to read the triggering CI run's job results.
  actions: read

jobs:
  # Deploy gates on the CI jobs that prove the release is sound, NOT on CI's
  # overall conclusion. Gating on the conclusion means any red job blocks the
  # release, including advisory ones: a failing govulncheck silently skipped
  # every deploy between 2026-08-04 and 2026-09-04, leaving production four
  # weeks stale while PRs kept merging (govulncheck is not a required check).
  #
  # Jobs listed in REQUIRED_JOBS block the release. Everything else in CI is
  # advisory - it reports, it does not stop a deploy. Renaming one of these
  # jobs in ci.yml without updating this list fails the deploy loudly rather
  # than skipping it silently, which is the point.
  gate:
    # Fork-PR guard: only ever deploy a CI run that a push triggered.
    if: github.event_name == 'workflow_dispatch' || github.event.workflow_run.event == 'push'
    runs-on: ubuntu-latest
    steps:
      - name: Require the release-gating CI jobs to have passed
        if: github.event_name == 'workflow_run'
        env:
          GH_TOKEN: ${{ github.token }}
          RUN_ID: ${{ github.event.workflow_run.id }}
          REQUIRED_JOBS: backend frontend api-client-fresh
        run: |
          set -euo pipefail
          gh api "repos/$GITHUB_REPOSITORY/actions/runs/$RUN_ID/jobs" --paginate \
            --jq '.jobs[] | "\(.name)=\(.conclusion)"' > jobs.txt
          echo "CI run $RUN_ID job results:"
          sed 's/^/  /' jobs.txt
          blocked=0
          for job in $REQUIRED_JOBS; do
            if ! grep -qxF "$job=success" jobs.txt; then
              echo "::error::required CI job '$job' did not succeed - refusing to deploy"
              blocked=1
            fi
          done
          if [ "$blocked" -eq 0 ]; then
            echo "All required jobs passed - proceeding with the deploy."
          fi
          exit "$blocked"

  build-push:
    needs: gate
    runs-on: ubuntu-latest
    env:
      DEPLOY_SHA: ${{ github.event.workflow_run.head_sha || github.sha }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ env.DEPLOY_SHA }}
      # ghcr repository names must be lowercase; the owner login is "Geelter".
      - name: Lowercase image owner
        run: echo "OWNER_LC=${GITHUB_REPOSITORY_OWNER,,}" >> "$GITHUB_ENV"
      - uses: docker/login-action@371161bbe7024a29a25c5e19bfcbc0804fe9ad2c # v4.5.2
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - uses: docker/build-push-action@53b7df96c91f9c12dcc8a07bcb9ccacbed38856a # v7.3.0
        with:
          context: backend
          push: true
          tags: |
            ghcr.io/${{ env.OWNER_LC }}/cube-planner-api:latest
            ghcr.io/${{ env.OWNER_LC }}/cube-planner-api:${{ env.DEPLOY_SHA }}
          build-args: |
            VERSION=${{ env.DEPLOY_SHA }}
            GIT_COMMIT=${{ env.DEPLOY_SHA }}
      - uses: docker/build-push-action@53b7df96c91f9c12dcc8a07bcb9ccacbed38856a # v7.3.0
        with:
          context: .
          file: frontend/Dockerfile
          push: true
          tags: |
            ghcr.io/${{ env.OWNER_LC }}/cube-planner-web:latest
            ghcr.io/${{ env.OWNER_LC }}/cube-planner-web:${{ env.DEPLOY_SHA }}

  deploy:
    needs: build-push
    runs-on: ubuntu-latest
    steps:
      - uses: appleboy/ssh-action@0ff4204d59e8e51228ff73bce53f80d53301dee2 # v1.2.5
        with:
          host: ${{ secrets.VPS_HOST }}
          username: ${{ secrets.VPS_USER }}
          key: ${{ secrets.VPS_SSH_KEY }}
          script: |
            cd /opt/cube-planner
            docker compose -f docker-compose.prod.yml pull
            docker compose -f docker-compose.prod.yml up -d
            docker image prune -f
